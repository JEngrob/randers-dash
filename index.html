const S = (x, y = 0, n = 1) => L.push({ t: 's', x: x * T, y: y * T, w: n * T, h: T });       // pigge
const D = (x, y, n = 1) => L.push({ t: 'd', x: x * T, y: y * T, w: n * T, h: T });           // hængende pigge
const Saw = (x, y, r = 1) => L.push({ t: 'w', x: (x - r) * T, y: (y - r) * T, w: 2 * r * T, h: 2 * r * T, cx: x * T, cy: y * T, r: r * T }); // savklinge
const P = (x, y = 0, c = 'y') => L.push({ t: 'p', x: x * T, y: y * T, w: T, h: T * 0.3, c }); // pad
const O = (x, y, c = 'y') => L.push({ t: 'o', x: x * T, y: y * T, w: T, h: T, c });          // orb
const K = (x, y) => L.push({ t: 'c', x: x * T, y: y * T, w: T, h: T });                      // hestesko
const V = (x, i, y = 0) => L.push({ t: 'v', x: x * T, y: y * T, w: T, h: 3 * T, m: SPEEDS[i], i });

const Z = (x, mini, y = 0) => L.push({ t: 'z', x: x * T, y: y * T, w: T, h: 3 * T, mini });

const LB = (x, y, w, h, look) => L.push({ t: 'b', x: x * T, y: y * T, w: w * T, h: h * T, look });      // bygning man kan lande på
const Water = (x, y, n) => L.push({ t: 'h', x: x * T, y: y * T, w: n * T, h: T * 0.6 });               // Gudenåen – vand er dødeligt

  } else if (k === 'KeyR' && (state === 'play' || state === 'pause')) { if (practice) checkpoints = []; resetAttempt(); }
  else if ((k === 'KeyC' || k === 'KeyZ') && state === 'play') addCheckpoint();
  else if (k === 'KeyX' && state === 'play') removeCheckpoint();
  else if (k === 'KeyB' && (state === 'pause' || state === 'win')) toSelect();
});
window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) setHeld(false, e.timeStamp); });
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const rc = cv.getBoundingClientRect(), x = e.clientX - rc.left, y = e.clientY - rc.top;
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { sfxClick(); b.fn(); return; }
  }
  if (state === 'play') setHeld(true, e.timeStamp);
});
window.addEventListener('pointerup', e => { setHeld(false, e.timeStamp); });
window.addEventListener('pointercancel', () => { held = false; inq.length = 0; });
window.addEventListener('blur', () => { held = false; inq.length = 0; pause(); });

// ---------- Effekter ----------
function speedName(m) {
  return m >= 1.8 ? 'SUPERSONISK!!' : m >= 1.5 ? 'LYNFART!' : m >= 1.25 ? 'TURBO!' : m >= 1 ? 'NORMAL FART' : 'LANGSOM';
}
function portalColor(o) {
  if (o.t === 'm') return MODE_COL[o.mode];
  if (o.t === 'g') return o.dir < 0 ? C.gold : C.sky;
  if (o.t === 'z') return o.mini ? '#ff6fd8' : C.green;
  return SPEED_COL[o.i];
}
function ring(x, y, col, dir = 1, size = 2.5) { rings.push({ x, y, col, t: 0, dir, size }); }
function portalFx(txt, col) {
  banner = { txt, col, t: 1.1 }; flash = 0.25; flashCol = hexRgb(col).join(','); shake = Math.max(shake, 0.12); shakeAmp = 8; sfxPortal();
  const sz = psize(p);
  ring(p.x + sz / 2, p.y + sz / 2, col, 1, 4);
  burst(26, col);
}
function burst(n, col) {
  const sz = psize(p);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 200 + Math.random() * 400;
    parts.push({ x: p.x + sz / 2, y: p.y + sz / 2, vx: Math.cos(a) * v + BASE * p.mul * 0.6, vy: Math.sin(a) * v, life: 0.6,
      max: 0.6, size: 4 + Math.random() * 6, col: Math.random() < 0.5 ? C.white : col, g: 0 });
  }
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixHex(a, b, t) {
  const A = hexRgb(a), Bc = hexRgb(b);
  return `rgb(${Math.round(A[0] + (Bc[0] - A[0]) * t)},${Math.round(A[1] + (Bc[1] - A[1]) * t)},${Math.round(A[2] + (Bc[2] - A[2]) * t)})`;
}
// Baggrund og jordfarve skifter blødt, når hesten passerer en farve-trigger
function colorsAt(x) {
  if (!COLS.length) return { bg: '#0b3a8f', gr: '#0a2a6b' };
  let i = 0; while (i + 1 < COLS.length && COLS[i + 1].x <= x) i++;
  const cur = COLS[i], prev = COLS[Math.max(0, i - 1)];
  const t = clamp((x - cur.x) / (0.6 * BASE), 0, 1);
  const tt = i === 0 ? 1 : t, nA = prev.neon && hexRgb(prev.neon), nB = cur.neon && hexRgb(cur.neon);
  const neon = nB ? (nA ? nA.map((v, k) => Math.round(v + (nB[k] - v) * tt)) : nB) : null;
  return { bg: mixHex(prev.bg, cur.bg, tt), gr: mixHex(prev.gr, cur.gr, tt), bgHex: cur.bg, neon };
}

// ---------- Opdatering ----------
function update(dt) {
  time += dt;
  if (state === 'play') {
    acc += dt;
    const now = frameNow ? performance.now() : 0;
    while (acc >= SUB) {
      // tryk der skete inden dette skridts sluttidspunkt – højst ét skift pr. skridt, så et kort tryk altid tæller
      if (inq.length && inq[0].t <= now - (acc - SUB) * 1000) held = inq.shift().h;
      const pm = p.mul, pmode = p.mode, pg = p.ground, pgrav = p.grav, pc = p.coins, pj = p.jumps, pmini = p.mini, pused = p.used.size;
      const wasHit = p.ncNow; p.ncNow = false; p.ncSteps = (p.ncSteps || 0) + 1;
      sub(p, held, SUB); acc -= SUB;
      if (p.dead) { die(); break; }
      if (p.ncNow) { p.ncHits = (p.ncHits || 0) + 1; if (!wasHit) { p.ncDeaths = (p.ncDeaths || 0) + 1; ncFlash = 0.25; sfxNoclip(); } }
      const sz = psize(p);
      if (p.jumps > pj) { save.jumps++; sessionJumps++; }
      if (p.used.size > pused) {
        // hvad blev ramt? (orb/pad giver ring)
        for (const o of L) if (p.used.has(o.id) && !o._fx && Math.abs(o.x - p.x) < 3 * T) {
          o._fx = attempt;
          if (o.t === 'o') ring(o.x + T / 2, o.y + T / 2, ORB_COL[o.c], -1, 2);
          if (o.t === 'p') ring(o.x + T / 2, o.y, ORB_COL[o.c], 1, 2);
        }
      }
      if (p.mul !== pm) portalFx(speedName(p.mul), SPEED_COL[SPEEDS.indexOf(p.mul)]);
      if (p.mode !== pmode) portalFx(MODE_NAME[p.mode] + '!', MODE_COL[p.mode]);
      if (p.grav !== pgrav && p.mode !== 'ball' && p.mode !== 'swing' && p.mode !== 'spider') portalFx(p.grav < 0 ? 'PÅ HOVEDET!' : 'NED IGEN!', p.grav < 0 ? C.gold : C.sky);
      if (p.mini !== pmini) portalFx(p.mini ? 'MINI!' : 'STOR IGEN!', p.mini ? '#ff6fd8' : C.green);
      if (p.coins > pc) { banner = { txt: 'HESTESKO!', col: C.gold, t: 1 }; burst(24, C.gold); sfxCoin(); }
      if (p.tele) { ring(p.x + sz / 2, p.tele.b + sz / 2, MODE_COL.spider, 1, 1.5); parts.push({ beam: true, x: p.tele.x + sz / 2, a: p.tele.a + sz / 2, b: p.tele.b + sz / 2, life: 0.2, max: 0.2 }); p.tele = null; }
      if (!pg && p.ground && p.mode === 'cube') {
        if (p.mul >= 1.5) { shake = Math.max(shake, 0.06); shakeAmp = 6; }
        const fy = p.grav > 0 ? p.y : p.y + sz;
        for (let i = 0; i < 6; i++) parts.push({ x: p.x + Math.random() * sz, y: fy, vx: -100 + Math.random() * 200, vy: (60 + Math.random() * 120) * p.grav,
          life: 0.3, max: 0.3, size: 3 + Math.random() * 4, col: C.white, g: 600 * p.grav });
      }
      if (p.x >= GOAL + T * 0.8) { win(); break; }
    }
    const sz = psize(p), vyl = p.vy * p.grav, sp = BASE * p.mul;
    // ikonets rotation
    if (p.mode === 'cube' && curSkin().full) p.rot += ((p.ground ? 0 : -0.35) - p.rot) * Math.min(1, dt * 12);   // stejler
    else if (p.mode === 'cube') {
      if (p.ground) p.rot += (Math.round(p.rot / (Math.PI * 2)) * Math.PI * 2 - p.rot) * Math.min(1, dt * 20);
      else p.rot += 13 * dt;                 // salto i luften
    } else if (p.mode === 'ship') p.rot += (-Math.atan2(vyl, sp) - p.rot) * Math.min(1, dt * 10);   // GD: drejer mod bevægelsen
    else if (p.mode === 'swing') p.rot += (clamp(-vyl / sp * 0.9, -0.7, 0.7) - p.rot) * Math.min(1, dt * 14);
    else if (p.mode === 'wave') p.rot = -Math.atan2(vyl, sp);
    else if (p.mode === 'ball') p.rot += sp * dt / (sz * 0.5) * p.grav;
    else if (p.mode === 'ufo') p.rot += (clamp(-vyl * 0.0005, -0.3, 0.3) - p.rot) * Math.min(1, dt * 10);
    else p.rot = 0;
    p.flip += (p.grav - p.flip) * Math.min(1, dt * 16);
    if (p.ground) p.ph += sp * dt * 0.05; else p.ph += dt * 6;
    // spor og partikler
    if (p.mode === 'wave') { trail.push({ x: p.x + sz / 2, y: p.y + sz / 2 }); if (trail.length > 90) trail.shift(); }
    else if (trail.length) trail.shift();
    if (p.ground && (p.mode === 'cube' || p.mode === 'ball' || p.mode === 'spider') && Math.random() < 0.7) {
      const fy = p.grav > 0 ? p.y + 2 : p.y + sz - 2;
      parts.push({ x: p.x + 4, y: fy, vx: -60 - Math.random() * 80, vy: (40 + Math.random() * 80) * p.grav,
        life: 0.35, max: 0.35, size: 3 + Math.random() * 4, col: Math.random() < 0.5 ? C.white : C.sky, g: 300 * p.grav });
    }
    if ((p.mode === 'ship' || p.mode === 'ufo' || p.mode === 'swing') && Math.random() < 0.9) parts.push({ x: p.x, y: p.y + sz * 0.5, vx: -140, vy: (Math.random() - 0.5) * 80,
      life: 0.35, max: 0.35, size: 3 + Math.random() * 5, col: Math.random() < 0.5 ? C.gold : '#ff7a1a', g: 0 });
    ghosts.push({ x: p.x, y: p.y, rot: p.rot, ph: p.ph, flip: p.flip }); if (ghosts.length > 10) ghosts.shift();
    // øvelse: automatiske checkpoints (gemmes først når hesten har overlevet et sekund efter)
    if (practice && state === 'play') {
      cpTimer += dt;
      if (cpTimer > 0.5 && (p.ground || p.mode !== 'cube')) { cpCand.push({ t: time, s: clonePlayer(p) }); cpTimer = 0; }
      while (cpCand.length && time - cpCand[0].t > 1) {
        const c = cpCand.shift(), lastX = checkpoints.length ? checkpoints[checkpoints.length - 1].x : -1e9;
        if (c.s.x > lastX + 6 * T) checkpoints.push(c.s);
      }
    }
    // kameraet følger hesten lodret (låses til korridoren i de andre tilstande)
    const vis = H / s;
    let ty = camY;
    if (p.mode === 'cube') {
      const lo = camY + vis * 0.28, hi = camY + vis * 0.6;
      if (p.y < lo) ty = p.y - vis * 0.28;
      if (p.y + sz > hi) ty = p.y + sz - vis * 0.6;
      ty = Math.max(ty, -2.5 * T);
    } else ty = (p.floor + p.ceil) / 2 - vis / 2;
    camY += (ty - camY) * Math.min(1, dt * (p.mode === 'cube' ? 5 : 4));
  } else if (state === 'dead') {
    deadT -= dt;
    if (deadT <= 0) { if (practice) respawnPractice(); else resetAttempt(); }
    // konfetti i klubfarver over stadion på bane 4
    if (isR4() && p.x > 205 * T && Math.random() < 0.5)
      parts.push({ x: p.x - 2 * T + Math.random() * 16 * T, y: camY + H / s, vx: (Math.random() - 0.5) * 120, vy: -40 - Math.random() * 80,
        life: 3, max: 3, size: 4 + Math.random() * 5, col: Math.random() < 0.5 ? C.white : '#2f7fff', g: 120, conf: true, spin: Math.random() * 6 });
  } else if (state === 'win') {
    winT += dt;
    if (winT < 2.5) {
      for (let i = 0; i < 3; i++) parts.push({ x: p.x - 5 * T + Math.random() * 14 * T, y: camY + H / s, vx: (Math.random() - 0.5) * 120,
        vy: -50 - Math.random() * 120, life: 3, max: 3, size: 5 + Math.random() * 6, col: Math.random() < 0.5 ? C.white : C.sky, g: 120, conf: true, spin: Math.random() * 6 });
    }
  } else if (state === 'select') {
    menuX += dt * BASE * 0.6;
  }
  // fartstriber
  const mul = state === 'play' ? p.mul : 1;
  if (state === 'play' && mul > 1.1 && Math.random() < (mul - 1) * 1.6)
    lines.push({ x: W + 20, y: Math.random() * H, len: 60 + Math.random() * 160 * mul, v: 1400 * mul, a: 0.08 + Math.random() * 0.15 });
  for (const l of lines) l.x -= l.v * dt;
  lines = lines.filter(l => l.x + l.len > 0);
  for (const q of parts) { q.life -= dt; if (!q.beam) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy -= q.g * dt; } }
  parts = parts.filter(q => q.life > 0);
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < 0.5);
  if (shake > 0) shake -= dt;
  if (ncFlash > 0) ncFlash -= dt;
  if (flash > 0) flash -= dt;
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
}

const LOGO = new Image(); LOGO.src = LOGO_SRC;
const logoReady = () => LOGO.complete && LOGO.naturalWidth > 0;
const X = x => (x - camX) * s;
const Y = y => H - (y - camY) * s;
const mod = (a, m) => ((a % m) + m) % m;
const fmt = n => Math.round(n).toLocaleString('da-DK');
// Neon-banen: NEON er afsnittets lysfarve [r,g,b] (skifter blødt), accent() er kantfarven på alle baner
let NEON = null;
const isNeon = () => !!LEVELS[LV].neon;
const na = a => NEON ? `rgba(${NEON[0]},${NEON[1]},${NEON[2]},${a})` : `rgba(63,123,255,${a})`;
const accent = () => isNeon() && NEON ? na(1) : LEVELS[LV].accent;

function pulse() {
  if (!AC || !musicOn || !kicks.length) return 0;
  const now = AC.currentTime; let lk = -1;
  for (const k of kicks) if (k <= now) lk = k;
  return lk < 0 ? 0 : Math.exp(-(now - lk) * 7);
}

// ---------- Bane 4: kampdag i Randers ----------
// Himmel med skyer og zeppeliner, byens silhuet, fans med halstørklæder og flag og LED-bander.
// Det tunge (silhuetter, tilskuere, bander) tegnes én gang i skjulte lærreder og genbruges.
const isR4 = () => !!LEVELS[LV].logo;
let r4c = null;
function r4Cache() {
  const key = `${W}x${H}x${s.toFixed(3)}x${dpr}x${logoReady()}`;
  if (r4c && r4c.key === key) return r4c;
  const z = T * s;
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr); const g = c.getContext('2d'); g.scale(dpr, dpr); return [c, g]; };
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // byens silhuet: huse, Sankt Mortens tårn, Verdos skorstene, Regnskovens kupler og Den Blå Bro
  const sky = (far) => {
    const w = 2400, h = 6 * z, [c, g] = mk(w, h), k = z / 40 * (far ? 0.8 : 1);
    g.fillStyle = far ? 'rgba(40,90,190,0.55)' : 'rgba(6,22,70,0.92)';
    const win = (x, y, ww, hh) => { if (far) return; for (let yy = y + 6 * k; yy < y + hh - 8 * k; yy += 11 * k) for (let xx = x + 5 * k; xx < x + ww - 8 * k; xx += 10 * k) if (rnd() < 0.35) { g.fillStyle = rnd() < 0.8 ? 'rgba(255,214,120,0.85)' : 'rgba(170,220,255,0.85)'; g.fillRect(xx, yy, 4 * k, 5 * k); } g.fillStyle = 'rgba(6,22,70,0.92)'; };
    let x = far ? 40 : 0, n = far ? 3 : 0;
    while (x < w) {
      const what = n++ % 9;
      if (what === 2) {                                   // kirketårn med spir
        const tw = 26 * k, th = 120 * k;
        g.fillRect(x, h - th, tw, th);
        g.beginPath(); g.moveTo(x - 3 * k, h - th); g.lineTo(x + tw / 2, h - th - 70 * k); g.lineTo(x + tw + 3 * k, h - th); g.fill();
        g.fillRect(x + tw / 2 - 1, h - th - 84 * k, 2, 14 * k); g.fillRect(x + tw / 2 - 5 * k, h - th - 79 * k, 10 * k, 2);
        g.fillRect(x + tw, h - 55 * k, 60 * k, 55 * k);   // kirkeskib
        g.beginPath(); g.moveTo(x + tw, h - 55 * k); g.lineTo(x + tw + 30 * k, h - 78 * k); g.lineTo(x + tw + 60 * k, h - 55 * k); g.fill();
        win(x + tw, h - 50 * k, 60 * k, 45 * k);
        x += tw + 80 * k;
      } else if (what === 5) {                            // to skorstene
        for (let i = 0; i < 2; i++) {
          const cx0 = x + i * 34 * k;
          g.fillRect(cx0, h - 200 * k, 14 * k, 200 * k);

    const pl = pulse();
    cx.translate(W / 2, H / 2); cx.rotate(Math.sin(time * 1.7) * 0.02); cx.scale(1 + pl * 0.012, 1 + pl * 0.012); cx.translate(-W / 2, -H / 2);
  }
  camX = state === 'select' ? menuX - (W / s) * 0.5 : p.x - (W / s) * 0.3;
  drawBackground(col);
  if (state !== 'select') {
    drawDeco();
    drawGround(col);
    drawWorldText();
    const x0 = camX - 2 * T, x1 = camX + W / s + 2 * T;
    for (const o of L) {
      if (o.x + o.w < x0) continue; if (o.x > x1) break;
      switch (o.t) {
        case 'b': drawBlock(o); break;
        case 's': drawSpikes(o, false); break;
        case 'd': drawSpikes(o, true); break;
        case 'w': drawSaw(o); break;
        case 'dm': drawDome(o); break;
        case 'h': drawWater(o); break;
        case 'p': drawPad(o); break;
        case 'o': drawOrb(o); break;
        case 'c': drawCoin(o); break;
        default: drawPortal(o);
      }
    }
    drawGoal();
    drawCheckpoints();
    drawParticles();
    drawPlayer();
    if (showHit) drawHitboxes();
  } else drawGround(col);
  cx.restore();
  if (flash > 0) { cx.fillStyle = `rgba(${flashCol},${flash * 1.2})`; cx.fillRect(0, 0, W, H); }
  // noclip: rødt blink hver gang hesten ville være død
  if (ncFlash > 0 && state === 'play') { cx.fillStyle = `rgba(255,30,50,${ncFlash * 1.4})`; cx.fillRect(0, 0, W, H); }
  if (state === 'select') { if (!kitOpen) drawSelectBack(); withUI(kitOpen ? drawKit : drawSelect); }
  else { drawHUD(); drawBanner(); }
  if (state === 'win') withUI(drawWin);
  if (state === 'pause') withUI(drawPause);
  if (portrait()) drawRotateHint();
}
// spillet er lavet til at ligge ned; på en telefon på højkant beder vi om at dreje den
const portrait = () => H > W * 1.05 && W < 700;
function drawRotateHint() {
  overlay(0.9);
  cx.save(); cx.translate(W / 2, H / 2 - 30); cx.rotate(Math.sin(time * 2) * 0.5 - 0.5);
  roundRect(-26, -44, 52, 88, 10); cx.strokeStyle = C.white; cx.lineWidth = 4; cx.stroke();
  cx.fillStyle = C.white; cx.fillRect(-8, 34, 16, 3); cx.restore();
  centerText('Drej telefonen', H / 2 + 60, 26);
  centerText('Randers Dash spilles på tværs', H / 2 + 88, 15, 700, '#9ec9ff');
}

// ---------- Hovedløkke ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; frameNow = now;
  if (state !== 'pause' && !portrait()) update(dt);
  pumpMusic();
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
